<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ЖК «Джигит» — 3D-тур</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909;color:#fff;font-family:Arial,Helvetica,sans-serif}#stage{position:fixed;inset:0;background:#090909}#pano{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}#pano.dragging{cursor:grabbing}.top{position:absolute;z-index:20;left:0;right:0;top:0;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:linear-gradient(to bottom,rgba(12,11,10,.82),rgba(12,11,10,0));pointer-events:none}.brand{font-size:12px;letter-spacing:.16em;text-transform:uppercase}.room{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75)}.hint{position:absolute;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,18,17,.72);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);padding:12px 16px;font-size:11px;letter-spacing:.08em;text-align:center;transition:opacity .5s;pointer-events:none}.nav{position:absolute;z-index:22;left:14px;bottom:86px;width:228px;max-height:calc(100vh - 160px);overflow:auto;padding:14px;background:rgba(20,18,17,.8);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);border-radius:8px}.nav h2{font-size:12px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;margin:0 0 10px;color:rgba(255,255,255,.72)}.rooms{display:grid;gap:4px}.rooms button{width:100%;border:1px solid transparent;background:transparent;color:rgba(255,255,255,.8);padding:10px 11px;text-align:left;font-size:11px;cursor:pointer;border-radius:5px}.rooms button:hover{background:rgba(255,255,255,.07);color:#fff}.rooms button.active{border-color:rgba(224,202,163,.55);background:rgba(224,202,163,.1);color:#fff}.thumbs{position:absolute;z-index:19;left:258px;right:18px;bottom:70px;height:82px;display:flex;gap:8px;overflow-x:auto;padding:7px;background:linear-gradient(to top,rgba(12,11,10,.82),rgba(12,11,10,.12));scrollbar-width:thin}.thumb{flex:0 0 116px;border:1px solid rgba(255,255,255,.15);background:rgba(20,18,17,.72);color:#fff;padding:0;cursor:pointer;border-radius:5px;overflow:hidden}.thumb img{display:block;width:100%;height:51px;object-fit:cover}.thumb span{display:block;padding:5px 6px;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.72)}.thumb.active{border-color:rgba(224,202,163,.75)}.thumb.active span{color:#fff}.bottom{position:absolute;z-index:20;left:0;right:0;bottom:0;height:70px;background:linear-gradient(to top,rgba(12,11,10,.9),rgba(12,11,10,.12));display:flex;align-items:center;justify-content:center;gap:16px;pointer-events:none}.bottom>*{pointer-events:auto}.arrow{width:42px;height:42px;border:1px solid rgba(255,255,255,.35);border-radius:50%;background:rgba(20,18,17,.55);color:#fff;font-size:23px;cursor:pointer}.counter{min-width:60px;text-align:center;font-size:11px;letter-spacing:.12em;color:rgba(255,255,255,.72)}.controls{position:absolute;z-index:20;right:18px;bottom:18px;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.controls button{border:1px solid rgba(255,255,255,.22);background:rgba(20,18,17,.74);color:#fff;padding:10px 13px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(12px);border-radius:4px}.controls button:hover{background:rgba(255,255,255,.12)}#planPanel{display:none;position:absolute;z-index:30;right:18px;top:82px;width:330px;max-height:calc(100vh - 110px);padding:12px;background:rgba(20,18,17,.92);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);border-radius:8px;overflow:auto}.caption{font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:9px;color:rgba(255,255,255,.72)}#planPanel img{display:block;width:100%;height:auto;background:#080808}.plan-note{font-size:10px;line-height:1.5;color:rgba(255,255,255,.55);margin-top:9px}@media(max-width:760px){.thumbs{left:10px;right:10px;bottom:62px;height:72px}.thumb{flex-basis:94px}.thumb img{height:42px}.top{height:60px;padding:0 12px}.brand{font-size:9px}.room{font-size:10px}.nav{left:10px;bottom:76px;width:calc(100vw - 20px);max-height:40vh}.controls{right:10px;bottom:10px}.controls button{min-height:40px}.bottom{height:60px}.arrow{width:38px;height:38px}.counter{min-width:50px}#planPanel{right:10px;top:68px;width:calc(100vw - 20px);max-height:70vh}}
</style></head><body>
<div id="stage"><canvas id="pano"></canvas></div>
<div class="top"><div class="brand">ЖК «ДЖИГИТ» · 2026</div><div class="room" id="roomName"></div></div>
<div class="hint" id="hint">Потяните изображение мышью или пальцем · колесо — приблизить</div>
<div class="nav"><h2>Помещения</h2><div class="rooms" id="rooms"></div></div>
<div class="controls"><button id="planBtn">План квартиры</button><button id="resetBtn">Сброс</button><button id="fullscreenBtn">Во весь экран</button></div>
<div id="planPanel"><div class="caption">План квартиры</div><img id="planImg" src="panoramas/plan.jpg" alt="План квартиры"><div class="plan-note">Выберите помещение слева или миниатюру снизу.</div></div>
<div class="thumbs" id="thumbs"></div><div class="bottom"><button class="arrow" id="prevBtn">‹</button><div class="counter" id="counter">1 / 15</div><button class="arrow" id="nextBtn">›</button></div>
<script>
(()=>{'use strict';
const rooms=[{"id":"living-entry","name":"Гостиная · вход","file":"panoramas/living-entry.jpg"},{"id":"living-window","name":"Гостиная · окно","file":"panoramas/living-window.jpg"},{"id":"kitchen-entry","name":"Кухня · вход","file":"panoramas/kitchen-entry.jpg"},{"id":"kitchen-window","name":"Кухня · окно","file":"panoramas/kitchen-window.jpg"},{"id":"bedroom1-entry","name":"Спальня 1 · вход","file":"panoramas/bedroom1-entry.jpg"},{"id":"bedroom1-window","name":"Спальня 1 · окно","file":"panoramas/bedroom1-window.jpg"},{"id":"bedroom2-entry","name":"Спальня 2 · вход","file":"panoramas/bedroom2-entry.jpg"},{"id":"bedroom2-window","name":"Спальня 2 · окно","file":"panoramas/bedroom2-window.jpg"},{"id":"bathroom","name":"Ванная","file":"panoramas/bathroom.jpg"},{"id":"toilet","name":"Туалет","file":"panoramas/toilet.jpg"},{"id":"wardrobe-entry","name":"Вход в гардероб","file":"panoramas/wardrobe-entry.jpg"},{"id":"wardrobe","name":"Гардероб","file":"panoramas/wardrobe.jpg"},{"id":"entry","name":"Прихожая","file":"panoramas/entry.jpg"},{"id":"corridor-entry","name":"Коридор · вход","file":"panoramas/corridor-entry.jpg"},{"id":"corridor-window","name":"Коридор · окно","file":"panoramas/corridor-window.jpg"}];
const canvas=document.getElementById('pano'),ctx=canvas.getContext('2d'),roomsEl=document.getElementById('rooms'),thumbsEl=document.getElementById('thumbs'),roomName=document.getElementById('roomName'),counter=document.getElementById('counter'),hint=document.getElementById('hint');
let current=null,index=0,yaw=0,pitch=0,fov=75,drag=false,lx=0,ly=0,img=null,raf=0;
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(innerWidth*d));canvas.height=Math.max(1,Math.floor(innerHeight*d));canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';draw()} addEventListener('resize',resize);resize();
function wrap(v,m){v%=m;if(v<0)v+=m;return v}
function draw(){cancelAnimationFrame(raf);raf=requestAnimationFrame(draw);ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#090909';ctx.fillRect(0,0,canvas.width,canvas.height);if(!img||!img.complete||!img.naturalWidth)return;const W=canvas.width,H=canvas.height;const viewWidth=Math.max(2*H,W*(360/fov)*0.92);const scale=viewWidth/img.naturalWidth;const ih=img.naturalHeight*scale;const y=(H-ih)/2 + pitch*H/100;const center=(wrap(yaw,360)/360)*viewWidth;let x=W/2-center;while(x>0)x-=viewWidth;while(x+viewWidth<W)x+=viewWidth;for(let k=-2;k<=2;k++)ctx.drawImage(img,x+k*viewWidth,y,viewWidth,ih)}
function build(){roomsEl.innerHTML='';thumbsEl.innerHTML='';rooms.forEach((r,i)=>{const b=document.createElement('button');b.textContent=r.name;b.type='button';b.dataset.room=r.id;b.onclick=()=>loadRoom(i);roomsEl.appendChild(b);const t=document.createElement('button');t.className='thumb';t.type='button';t.dataset.room=r.id;t.innerHTML='<img src="'+r.file+'" alt=""><span>'+r.name+'</span>';t.onclick=()=>loadRoom(i);thumbsEl.appendChild(t)})}
function loadRoom(i){index=i;current=rooms[i];roomName.textContent=current.name;counter.textContent=(i+1)+' / '+rooms.length;document.querySelectorAll('.rooms button,.thumb').forEach(b=>b.classList.toggle('active',b.dataset.room===current.id));yaw=current.startYaw||0;pitch=current.pitch||0;fov=75;img=new Image();img.onload=()=>{hint.style.opacity='0';draw()};img.onerror=()=>{hint.textContent='Не удалось загрузить панораму: '+current.file;hint.style.opacity='1'};img.src=current.file}
function step(d){loadRoom((index+d+rooms.length)%rooms.length)}
canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.classList.add('dragging');canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;yaw-=dx*0.22;pitch=Math.max(-28,Math.min(28,pitch+dy*0.12));draw()});canvas.addEventListener('pointerup',()=>{drag=false;canvas.classList.remove('dragging')});canvas.addEventListener('pointercancel',()=>{drag=false;canvas.classList.remove('dragging')});canvas.addEventListener('wheel',e=>{e.preventDefault();fov=Math.max(45,Math.min(110,fov+e.deltaY*.05));draw()},{passive:false});
document.getElementById('prevBtn').onclick=()=>step(-1);document.getElementById('nextBtn').onclick=()=>step(1);document.getElementById('resetBtn').onclick=()=>{yaw=current?.startYaw||0;pitch=current?.pitch||0;fov=75;draw()};document.getElementById('planBtn').onclick=()=>{const p=document.getElementById('planPanel');p.style.display=p.style.display==='block'?'none':'block'};document.getElementById('fullscreenBtn').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);if(e.key==='Escape')document.getElementById('planPanel').style.display='none'});
build();loadRoom(0);
})();
</script></body></html>
