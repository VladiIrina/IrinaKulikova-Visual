<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ЖК «Альтаир» — 3D-тур</title>
<meta name="description" content="Интерактивный 360° тур интерьера ЖК «Альтаир».">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#161514;color:#fff;font-family:Arial,Helvetica,sans-serif}
#app{position:fixed;inset:0;background:#161514}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

#markerLayer{position:absolute;inset:0;z-index:16;pointer-events:none;overflow:hidden}



.top{position:absolute;z-index:20;left:0;right:0;top:0;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:linear-gradient(to bottom,rgba(12,11,10,.82),rgba(12,11,10,0));pointer-events:none}.brand{font-size:12px;letter-spacing:.16em;text-transform:uppercase}.room{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75)}.nav{position:absolute;z-index:22;left:14px;bottom:86px;width:228px;max-height:calc(100vh - 160px);overflow:auto;padding:14px;background:rgba(20,18,17,.8);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);border-radius:8px}.nav h2{font-size:12px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;margin:0 0 10px;color:rgba(255,255,255,.72)}.rooms{display:grid;gap:4px}.rooms button{width:100%;border:1px solid transparent;background:transparent;color:rgba(255,255,255,.8);padding:10px 11px;text-align:left;font-size:11px;cursor:pointer;border-radius:5px}.rooms button:hover{background:rgba(255,255,255,.07);color:#fff}.rooms button.active{border-color:rgba(224,202,163,.55);background:rgba(224,202,163,.1);color:#fff}.controls{position:absolute;z-index:20;right:18px;bottom:18px;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.controls button{border:1px solid rgba(255,255,255,.22);border-radius:4px;background:rgba(20,18,17,.74);color:#fff;padding:10px 13px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(12px)}.controls button:hover{background:rgba(255,255,255,.12)}#planPanel{display:none;position:absolute;z-index:30;right:18px;top:82px;width:330px;max-height:calc(100vh - 110px);padding:12px;background:rgba(20,18,17,.92);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);border-radius:8px;overflow:auto}.caption{font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:9px;color:rgba(255,255,255,.72)}#planPanel img{display:block;width:100%;height:auto;background:#080808}
#hint{
 position:absolute;z-index:13;left:50%;top:50%;transform:translate(-50%,-50%);
 background:rgba(20,18,17,.68);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);
 padding:12px 16px;font-size:11px;letter-spacing:.08em;text-align:center;transition:opacity .5s
}
@media(max-width:640px){
 .top{padding:12px}.brand{font-size:9px}.room{font-size:10px}
 .nav{left:12px;bottom:12px;width:calc(100vw - 24px)}
 .controls{right:12px;bottom:12px}
 #planPanel{right:12px;top:62px;width:calc(100vw - 24px)}
 button{min-width:44px;min-height:44px}
}
</style>
</head>
<body>
<div id="app">
<canvas id="gl" aria-label="Интерактивная 360-градусная панорама"></canvas>
</div>
<div id="fallback"><div><h2>3D-тур</h2><p>Браузер не поддерживает WebGL. Откройте тур в современном Chrome, Яндекс Браузере, Safari, Edge или Firefox.</p></div></div>
<div class="top">
  <div class="brand">ЖК «Альтаир» · 360° TOUR</div>
  <div class="room" id="roomName">Гостиная</div>
</div>
<div id="hint">Потяните изображение мышью или пальцем · колесо — приблизить</div>
<div class="nav">
  <h2>Помещения</h2>
  <div class="rooms" id="rooms"></div>
</div>
<div class="controls">
  <button id="planBtn">План</button>
  <button id="resetBtn">Сброс</button>
  <button id="fullscreenBtn">Во весь экран</button>
</div>
<div id="planPanel">
  <div class="caption">План квартиры</div>
  <img src="panoramas/plan.jpg" alt="План квартиры">
</div>
</div>

<script>
(() => {
"use strict";
const rooms = [
 {id:"living", name:"Гостиная", file:"panoramas/hd-living-main.jpg", startYaw:0, pitch:0},
 {id:"living-window", name:"Гостиная · окно", file:"panoramas/hd-living-window.jpg", startYaw:0, pitch:0},
 {id:"hall", name:"Коридор", file:"panoramas/hd-hall.jpg", startYaw:0, pitch:0},
 {id:"kitchen", name:"Кухня", file:"panoramas/hd-kitchen-main.jpg", startYaw:0, pitch:0},
 {id:"kitchen-window", name:"Кухня · окно", file:"panoramas/hd-kitchen-window.jpg", startYaw:0, pitch:0},
 {id:"bathroom", name:"Ванная", file:"panoramas/hd-bathroom.jpg", startYaw:0, pitch:0}
];

const canvas=document.getElementById("gl");
const fallback=document.getElementById("fallback");
const roomName=document.getElementById("roomName");
const hint=document.getElementById("hint");
const roomsEl=document.getElementById("rooms");
const planPanel=document.getElementById("planPanel");

rooms.forEach(r=>{
 const b=document.createElement("button");
 b.type="button"; b.textContent=r.name;
 b.dataset.room=r.id;
 b.addEventListener("click",()=>loadRoom(r.id));
 roomsEl.appendChild(b);
});

const gl=canvas.getContext("webgl",{alpha:false,antialias:true,preserveDrawingBuffer:false});
if(!gl){fallback.style.display="grid"; return;}

const vs=`
attribute vec3 aPos;
attribute vec2 aUv;
uniform mat4 uMvp;
varying vec2 vUv;
void main(){gl_Position=uMvp*vec4(aPos,1.0);vUv=aUv;}
`;
const fs=`
precision mediump float;
varying vec2 vUv;
uniform sampler2D uTex;
void main(){gl_FragColor=texture2D(uTex,vUv);}
`;
function shader(type,src){
 const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
 if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
 return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));
gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){fallback.style.display="grid";return;}
gl.useProgram(prog);

const locPos=gl.getAttribLocation(prog,"aPos");
const locUv=gl.getAttribLocation(prog,"aUv");
const locMvp=gl.getUniformLocation(prog,"uMvp");
const locTex=gl.getUniformLocation(prog,"uTex");

// Inside-out sphere: camera sits at the center and sees the texture from inside.
const seg=128, rings=64, verts=[], uvs=[], idx=[];
for(let y=0;y<=rings;y++){
 const v=y/rings, phi=v*Math.PI;
 for(let x=0;x<=seg;x++){
   const u=x/seg, th=u*Math.PI*2;
   const sx=Math.sin(phi)*Math.cos(th), sy=Math.cos(phi), sz=Math.sin(phi)*Math.sin(th);
   verts.push(sx,sy,sz); uvs.push(u,v);
 }
}
for(let y=0;y<rings;y++){
 for(let x=0;x<seg;x++){
   const a=y*(seg+1)+x,b=a+1,c=a+seg+1,d=c+1;
   idx.push(a,c,b,b,c,d);
 }
}
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW);
const ub=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,ub);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(uvs),gl.STATIC_DRAW);
const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(idx),gl.STATIC_DRAW);

const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

let current=null, yaw=0, pitch=0, fov=75, drag=false, lx=0, ly=0;
let img=null;

function resize(){
 const d=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.max(1,Math.floor(innerWidth*d));
 canvas.height=Math.max(1,Math.floor(innerHeight*d));
 gl.viewport(0,0,canvas.width,canvas.height);
}
window.addEventListener("resize",()=>{resize();});resize();

function matMul(a,b){
 const o=new Float32Array(16);
 for(let c=0;c<4;c++)for(let r=0;r<4;r++)
   o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];
 return o;
}
function perspective(fovy,aspect,near,far){
 const f=1/Math.tan(fovy*Math.PI/360), nf=1/(near-far);
 return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*nf,-1,0,0,2*far*near*nf,0]);
}
function rotX(a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array([1,0,0,0,0,c,s,0,0,-s,c,0,0,0,0,1]);}
function rotY(a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array([c,0,-s,0,0,1,0,0,s,0,c,0,0,0,0,1]);}

function draw(){
 gl.clearColor(.04,.035,.03,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.disable(gl.CULL_FACE);gl.enable(gl.DEPTH_TEST);
 const p=perspective(fov,canvas.width/canvas.height,.01,10);
 const view=matMul(rotX(pitch*Math.PI/180),rotY(yaw*Math.PI/180));
 const mvp=matMul(p,view);
 gl.useProgram(prog);gl.uniformMatrix4fv(locMvp,false,mvp);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(locTex,0);
 gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.enableVertexAttribArray(locPos);gl.vertexAttribPointer(locPos,3,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ARRAY_BUFFER,ub);gl.enableVertexAttribArray(locUv);gl.vertexAttribPointer(locUv,2,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.drawElements(gl.TRIANGLES,idx.length,gl.UNSIGNED_SHORT,0);
  requestAnimationFrame(draw);
}
function loadRoom(id){
 const r=rooms.find(x=>x.id===id); if(!r)return;
 current=r;yaw=r.startYaw||0;pitch=r.pitch||0;fov=75;
 roomName.textContent=r.name;
  document.querySelectorAll(".rooms button").forEach(b=>b.classList.toggle("active",b.dataset.room===id));
 const image=new Image();
 image.onload=()=>{
   img=image;gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
   gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
   hint.style.opacity="0";
 };
 image.onerror=()=>{roomName.textContent=r.name+" · ошибка загрузки";hint.textContent="Не удалось загрузить панораму: "+r.file;hint.style.opacity="1";};
 image.src=r.file;
}
canvas.addEventListener("pointerdown",e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture?.(e.pointerId);});
canvas.addEventListener("pointermove",e=>{
 if(!drag)return;
 const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
 yaw-=dx*.16;pitch+=dy*.12;pitch=Math.max(-85,Math.min(85,pitch));
});
canvas.addEventListener("pointerup",()=>drag=false);
canvas.addEventListener("pointercancel",()=>drag=false);
canvas.addEventListener("wheel",e=>{e.preventDefault();fov+=e.deltaY*.04;fov=Math.max(45,Math.min(100,fov));},{passive:false});
document.getElementById("resetBtn").addEventListener("click",()=>{yaw=current?.startYaw||0;pitch=current?.pitch||0;fov=75;});
document.getElementById("planBtn").addEventListener("click",()=>{
 planPanel.style.display=planPanel.style.display==="block"?"none":"block";
});
document.getElementById("fullscreenBtn").addEventListener("click",async()=>{
 try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}
 catch(e){}
});

draw();
loadRoom("living");
})();
</script>
</body>
</html>
